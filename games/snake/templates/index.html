<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Docker Game Factory - Snake</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #111827,
            #1f2937
        );

    color: white;

}


.container {

    text-align: center;

    padding: 20px;

}


h1 {

    font-size: 36px;

    margin-bottom: 5px;

}


.subtitle {

    color: #9ca3af;

    margin-bottom: 20px;

}


canvas {

    background: #111;

    border: 3px solid #374151;

    border-radius: 10px;

    display: block;

    margin: auto;

}


.score {

    margin-top: 15px;

    font-size: 20px;

}


button {

    margin-top: 20px;

    padding:
        12px
        25px;

    border: none;

    border-radius: 8px;

    background: #2563eb;

    color: white;

    font-size: 16px;

    cursor: pointer;

}


button:hover {

    background: #1d4ed8;

}


.instructions {

    margin-top: 15px;

    color: #9ca3af;

    font-size: 14px;

}


.factory {

    margin-top: 25px;

    color: #6b7280;

    font-size: 13px;

}

</style>

</head>


<body>


<div class="container">


<h1>🐍 Snake</h1>


<div class="subtitle">

Docker Game Factory

</div>


<canvas
    id="game"
    width="400"
    height="400"
></canvas>


<div class="score">

Score:
<span id="score">0</span>

</div>


<button onclick="restartGame()">

🔄 Restart Game

</button>


<div class="instructions">

Use Arrow Keys or WASD to move

</div>


<div class="factory">

Powered by Docker Game Factory

</div>


</div>


<script>


const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


const gridSize = 20;

const tileCount =
    canvas.width / gridSize;


let snake;

let food;

let direction;

let nextDirection;

let score;

let gameRunning;


function initializeGame() {

    snake = [
        {
            x: 10,
            y: 10
        }
    ];

    direction = {
        x: 1,
        y: 0
    };

    nextDirection = {
        x: 1,
        y: 0
    };

    score = 0;

    gameRunning = true;

    placeFood();

    updateScore();

}


function placeFood() {

    do {

        food = {

            x:
                Math.floor(
                    Math.random()
                    * tileCount
                ),

            y:
                Math.floor(
                    Math.random()
                    * tileCount
                )

        };

    } while (
        snake.some(
            part =>
                part.x === food.x &&
                part.y === food.y
        )
    );

}


function updateScore() {

    document
        .getElementById("score")
        .innerText = score;

}


function drawGame() {

    if (!gameRunning) {

        return;

    }


    direction = nextDirection;


    const head = {

        x:
            snake[0].x
            + direction.x,

        y:
            snake[0].y
            + direction.y

    };


    // Wall collision

    if (

        head.x < 0 ||
        head.x >= tileCount ||
        head.y < 0 ||
        head.y >= tileCount

    ) {

        gameOver();

        return;

    }


    // Self collision

    if (

        snake.some(
            part =>
                part.x === head.x &&
                part.y === head.y
        )

    ) {

        gameOver();

        return;

    }


    snake.unshift(head);


    // Food

    if (

        head.x === food.x &&
        head.y === food.y

    ) {

        score += 10;

        updateScore();

        placeFood();

    } else {

        snake.pop();

    }


    // Background

    ctx.fillStyle = "#111";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Food

    ctx.fillStyle = "#ef4444";

    ctx.fillRect(

        food.x * gridSize,

        food.y * gridSize,

        gridSize - 2,

        gridSize - 2

    );


    // Snake

    snake.forEach(
        (part, index) => {

            ctx.fillStyle =
                index === 0
                ? "#22c55e"
                : "#16a34a";


            ctx.fillRect(

                part.x * gridSize,

                part.y * gridSize,

                gridSize - 2,

                gridSize - 2

            );

        }
    );

}


function gameOver() {

    gameRunning = false;


    setTimeout(
        () => {

            alert(
                "Game Over! Score: "
                + score
            );

        },
        50
    );

}


function restartGame() {

    initializeGame();

}


document.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();


        if (

            (key === "arrowup" || key === "w") &&
            direction.y !== 1

        ) {

            nextDirection = {
                x: 0,
                y: -1
            };

        }


        if (

            (key === "arrowdown" || key === "s") &&
            direction.y !== -1

        ) {

            nextDirection = {
                x: 0,
                y: 1
            };

        }


        if (

            (key === "arrowleft" || key === "a") &&
            direction.x !== 1

        ) {

            nextDirection = {
                x: -1,
                y: 0
            };

        }


        if (

            (key === "arrowright" || key === "d") &&
            direction.x !== -1

        ) {

            nextDirection = {
                x: 1,
                y: 0
            };

        }

    }
);


initializeGame();


setInterval(
    drawGame,
    120
);


</script>


</body>

</html>
