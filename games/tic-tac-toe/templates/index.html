<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Docker Game Factory - Tic-Tac-Toe</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #1f2937
                );

            color: white;

        }


        .container {

            width: 100%;

            max-width: 500px;

            padding: 30px;

            text-align: center;

        }


        .title {

            font-size: 36px;

            margin-bottom: 10px;

        }


        .subtitle {

            color: #9ca3af;

            margin-bottom: 30px;

        }


        .game-board {

            display: grid;

            grid-template-columns:
                repeat(3, 100px);

            grid-template-rows:
                repeat(3, 100px);

            gap: 8px;

            justify-content: center;

            margin: auto;

        }


        .cell {

            width: 100px;

            height: 100px;

            border: none;

            border-radius: 12px;

            background: #374151;

            color: white;

            font-size: 42px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

        }


        .cell:hover {

            background: #4b5563;

            transform: scale(1.03);

        }


        .cell:disabled {

            cursor: not-allowed;

        }


        .status {

            margin-top: 25px;

            font-size: 20px;

            min-height: 30px;

        }


        .buttons {

            margin-top: 25px;

        }


        .reset-button {

            padding:
                12px
                25px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }


        .reset-button:hover {

            background: #1d4ed8;

        }


        .factory {

            margin-top: 30px;

            color: #6b7280;

            font-size: 13px;

        }


        @media (max-width: 450px) {

            .game-board {

                grid-template-columns:
                    repeat(3, 80px);

                grid-template-rows:
                    repeat(3, 80px);

            }


            .cell {

                width: 80px;

                height: 80px;

                font-size: 32px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="title">

        🎮 Tic-Tac-Toe

    </div>


    <div class="subtitle">

        Docker Game Factory

    </div>


    <div
        id="board"
        class="game-board"
    >

        <button
            class="cell"
            onclick="makeMove(0)"
        ></button>

        <button
            class="cell"
            onclick="makeMove(1)"
        ></button>

        <button
            class="cell"
            onclick="makeMove(2)"
        ></button>


        <button
            class="cell"
            onclick="makeMove(3)"
        ></button>

        <button
            class="cell"
            onclick="makeMove(4)"
        ></button>

        <button
            class="cell"
            onclick="makeMove(5)"
        ></button>


        <button
            class="cell"
            onclick="makeMove(6)"
        ></button>

        <button
            class="cell"
            onclick="makeMove(7)"
        ></button>

        <button
            class="cell"
            onclick="makeMove(8)"
        ></button>

    </div>


    <div
        id="status"
        class="status"
    >

        Your turn — X

    </div>


    <div class="buttons">

        <button
            class="reset-button"
            onclick="resetGame()"
        >

            🔄 Reset Game

        </button>

    </div>


    <div class="factory">

        Powered by Docker Game Factory

    </div>


</div>


<script>


let gameOver = false;


async function makeMove(position) {

    if (gameOver) {

        return;

    }


    try {

        const response = await fetch(
            "./move",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    position: position
                })
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            showStatus(
                data.error ||
                "Something went wrong."
            );

            return;

        }


        updateBoard(data.board);


        if (data.winner) {

            gameOver = true;


            if (
                data.winner === "draw"
            ) {

                showStatus(
                    "🤝 Game Draw!"
                );

            } else {

                showStatus(
                    "🎉 " +
                    data.winner +
                    " Wins!"
                );

            }

        } else {

            showStatus(
                "Your turn — X"
            );

        }

    } catch (error) {

        console.error(error);

        showStatus(
            "Unable to communicate with server."
        );

    }

}


function updateBoard(board) {

    const cells =
        document.querySelectorAll(
            ".cell"
        );


    cells.forEach(
        (cell, index) => {

            cell.innerText =
                board[index];

            cell.disabled =
                board[index] !== "";

        }
    );

}


function showStatus(message) {

    document
        .getElementById("status")
        .innerText = message;

}


async function resetGame() {

    try {

        const response =
            await fetch(
                "./reset",
                {
                    method: "POST"
                }
            );


        const data =
            await response.json();


        updateBoard(
            data.board
        );


        gameOver = false;


        showStatus(
            "Your turn — X"
        );

    } catch (error) {

        console.error(error);

        showStatus(
            "Unable to reset game."
        );

    }

}


</script>


</body>

</html>
