<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Docker Game Factory</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #1e293b);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            text-align: center;
            padding: 40px 20px;
        }

        .logo {
            font-size: 60px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 42px;
            margin: 0;
        }

        .subtitle {
            color: #aeb8c7;
            font-size: 18px;
            margin: 15px 0 40px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 35px 25px;
            transition: transform 0.2s, background 0.2s;
        }

        .game-card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.13);
        }

        .game-icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        .game-card h2 {
            font-size: 27px;
            margin: 10px 0;
        }

        .game-card p {
            color: #aeb8c7;
            min-height: 45px;
        }

        .play-button {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 28px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.2s;
        }

        .play-button:hover {
            background: #1d4ed8;
        }

        .footer {
            margin-top: 45px;
            color: #718096;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">🎮</div>

    <h1>Docker Game Factory</h1>

    <p class="subtitle">
        Containerized games powered by Docker, Linux and DevOps automation
    </p>

    <div class="games">

        <div class="game-card">

            <div class="game-icon">
                ❌⭕
            </div>

            <h2>Tic-Tac-Toe</h2>

            <p>
                Classic two-player Tic-Tac-Toe.
            </p>

            <a
                class="play-button"
                href="/tic-tac-toe/"
            >
                ▶ Play Tic-Tac-Toe
            </a>

        </div>


        <div class="game-card">

            <div class="game-icon">
                🐍
            </div>

            <h2>Snake</h2>

            <p>
                Control the snake, collect food and beat your high score.
            </p>

            <a
                class="play-button"
                href="/snake/"
            >
                ▶ Play Snake
            </a>

        </div>

    </div>

    <div class="footer">
        Docker Game Factory • AWS EC2 • Docker • Nginx
    </div>

</div>

</body>
</html>
